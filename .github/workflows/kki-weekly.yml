# Production weekly pipeline for standalone repo (The-Tech-Bay/khobz-index).
# While khobz-index/ lives in the Karama monorepo, the active schedule is the
# parent workflow at ../../.github/workflows/kki-weekly.yml (working-directory: khobz-index).
# Enable this file and disable the parent cron on export day — see docs/ops/public-repo-export.md.

name: KKI Weekly Pipeline

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: kki-weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve 6-month window for fixture history
        id: months
        run: |
          FROM=$(date -u -d "$(date -u +%Y-%m-01) -6 months" +%Y-%m 2>/dev/null || date -u -v-6m +%Y-%m)
          TO=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m 2>/dev/null || date -u -v-1m +%Y-%m)
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO" >> "$GITHUB_OUTPUT"
          echo "Pipeline window: $FROM → $TO"

      - name: Fetch FAOSTAT producer prices (bulk CSV → JSON envelope)
        env:
          PIPELINE_FILL_TO: ${{ steps.months.outputs.to }}
        run: bun run pipeline:prefetch

      - name: Run pipeline (fetch → calculate → R2 mirror + summaries)
        env:
          FAOSTAT_CP_JSON_PATH: data/reference/faostat-pp-backfill.json
          HISTORICAL_CPI_JSON_PATH: data/reference/historical-cpi-envelope.json
        run: bun run src/pipeline/run.ts --from=${{ steps.months.outputs.from }} --to=${{ steps.months.outputs.to }}

      - name: Assert fixture history density (block collapsed publish)
        run: bun run scripts/assert-fixture-density.ts landing/public/data/fixture

      - name: Source degradation warning
        run: |
          set -euo pipefail
          DEG="$(jq -r '.degraded_source_count // 0' build/pipeline-run-summary.json)"
          if [ "${DEG}" -ge 2 ]; then
            echo "::warning::KKI pipeline: ${DEG} sources not healthy (see build/pipeline-run-summary.json)"
          fi

      - name: Install wrangler
        run: npm install -g wrangler@4.90.0

      # Ship user-visible deliverables (Release + landing) BEFORE the slow R2
      # mirror so a long mirror upload can never starve them under the job cap.
      - name: GitHub Release (build artifacts)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kki-weekly-${{ github.run_id }}
          name: "KKI weekly run ${{ github.run_id }}"
          body: |
            Automated weekly pipeline artifact (§3.8B). See `pipeline-run-summary.json` in attached files.
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            build/khobz-index-*.json
            build/khobz-index-*.csv
            build/pipeline-run-summary.json
            build/pipeline-kv-pipeline-status.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and deploy landing page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN unset — skipping landing deploy."
            exit 0
          fi
          cd landing && bun install --frozen-lockfile && bun run build && wrangler pages deploy dist --project-name=khobz-index-landing --branch=main --commit-dirty=true

      - name: Update Workers KV (GET /health)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KKI_KV_NAMESPACE_ID: ${{ secrets.KKI_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${KKI_KV_NAMESPACE_ID:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN or KKI_KV_NAMESPACE_ID unset — skipping KV update."
            exit 0
          fi
          wrangler kv key put pipeline:status --namespace-id="${KKI_KV_NAMESPACE_ID}" --path=build/pipeline-kv-pipeline-status.json --remote

      # Best-effort mirror, runs last and is time-bounded so it can never fail
      # the run after deliverables shipped; remaining objects sync next run.
      - name: Sync R2 (mirror + state)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID unset — skipping R2 sync."
            exit 0
          fi
          wrangler --version
          upload_one() {
            local f="$1"
            local rel="${f#build/r2-mirror/}"
            wrangler r2 object put "khobz-index-snapshots/${rel}" --file="$f" --remote 2>/dev/null && echo "OK: $rel" || echo "FAIL: $rel" >&2
          }
          export -f upload_one
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          if [ -d build/r2-mirror ]; then
            timeout 1800 bash -c 'find build/r2-mirror -type f | xargs -P 8 -I{} bash -c '"'"'upload_one "$@"'"'"' _ {}' \
              || echo "::warning::R2 mirror sync time-bounded (1800s); remaining objects sync next run"
          fi
          if [ -f build/last-run-state.json ]; then
            wrangler r2 object put khobz-index-snapshots/state/last-run.json --file=build/last-run-state.json --remote || echo "::warning::R2 state upload failed; non-fatal"
          fi

  notify-failure:
    needs: weekly
    if: ${{ always() && needs.weekly.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open ops issue (email via GitHub notifications)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CRITICAL] KKI weekly pipeline failed (run ${context.runId})`,
              body: `Workflow: ${context.workflow}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nEnable **Watch → Actions** or **Settings → Notifications → Actions** on the repo for email alerts.`,
            });
